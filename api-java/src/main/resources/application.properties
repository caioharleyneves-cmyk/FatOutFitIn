spring.application.name=fatoutfitin-api-java
server.port=8080

# Arquivo onde os treinos ficam salvos (criado automaticamente)
fatoutfitin.arquivo-dados=data/treinos.json

# Erros em JSON sem stacktrace
server.error.include-stacktrace=never
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
